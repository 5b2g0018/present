<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>西瓜🍉生日快樂 🎂 | 專屬生日信件 💌</title>
    <meta name="description" content="給西瓜的專屬 K-pop 風格生日祝福信件！點擊信封開啟滿滿祝福。">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css?v=9">
</head>

<body>

    <!-- Main App Container (Background set to 瓜瓜.jpg) -->
    <div id="app-container">

        <!-- Canvas for Heart, Sparkle & Lightstick Particle Engine -->
        <canvas id="particles-canvas"></canvas>


        <!-- Central Mobile Single Envelope Stage -->
        <main class="mobile-envelope-stage">
            <div class="envelope-stage-header">
                <h1 class="envelope-main-title">給瓜瓜🍉的生日信件 💌</h1>
                <p class="envelope-main-subtitle">點擊中央信封解鎖生日祝福與故事 ✨</p>
            </div>

            <!-- Single Unique Curved K-pop Envelope Container -->
            <div id="single-envelope-wrapper" class="single-envelope-wrapper unique-curved-envelope"
                onclick="openEnvelope(event)">
                <div class="envelope-card-body">
                    <!-- Top Gold VIP Badge -->
                    <div class="envelope-gold-stamp">
                        <span>VIP 🍉 PASS</span>
                    </div>

                    <!-- Left Postage Stamp -->
                    <div class="envelope-postage-stamp">
                        <span class="stamp-icon">🍉</span>
                    </div>

                    <!-- Holographic Shimmer Layer -->
                    <div class="envelope-holo-overlay"></div>

                    <!-- 3D Curved Top Flap -->
                    <div class="curved-flap-top"></div>

                    <!-- Center Heart Wax Seal Button -->
                    <div class="wax-seal" title="點擊開啟信封">
                        <div class="wax-seal-inner">
                            <span class="seal-icon">💖</span>
                            <span class="seal-text">開啟</span>
                        </div>
                    </div>

                    <!-- Cover Recipient Text -->
                    <div class="cover-text">
                        <h2 class="cover-recipient-title">To: 西瓜🍉🎂</h2>
                        <p class="cover-subtitle">點擊開啟瓜瓜的專屬祝福 ✨</p>
                    </div>
                </div>
            </div>

            <!-- Tap Prompt Tag -->
            <div class="open-prompt-tag" onclick="openEnvelope(event)">
                點擊信封開啟✨
            </div>
        </main>

        <!-- Opened Letter Modal Paper Card -->
        <article id="letter-paper" class="letter-paper-modal">
            <button id="close-letter-btn" class="close-letter-btn" title="關閉卡片"
                onclick="closeEnvelope()">&times;</button>

            <div class="letter-inner-content">
                <!-- Header with Title & Stamps -->
                <div class="letter-header-decor">
                    <div id="badge-tag" class="badge-tag">
                        💙 TZUYU LOVELY BIRTHDAY LETTER
                    </div>
                    <div id="letter-stamps" class="letter-stamps">
                        <!-- Populated dynamically with mini Lovely stamps -->
                    </div>
                </div>

                <!-- Recipient Line -->
                <div class="letter-recipient">
                    To: <span id="letter-recipient-text">西瓜🍉</span>
                </div>

                <!-- Letter Body Text -->
                <div id="letter-body-text" class="letter-body">
                    <!-- Populated dynamically -->
                </div>

                <!-- Memory Polaroid Section -->
                <div id="polaroid-frame" class="polaroid-container" title="點擊放大圖片">
                    <img id="polaroid-img" class="polaroid-img" src="images/33.jpg" alt="Special Memory Photo">
                    <div id="polaroid-caption" class="polaroid-caption">💜 TWICE 💙</div>
                </div>

                <!-- Letter Footer & Sender -->
                <div class="letter-footer">
                    <div class="letter-date" id="letter-date-text">2026.09.25</div>
                    <div class="letter-sender">
                        Your friend, <span id="letter-sender-text">松鼠 🐿️</span>
                    </div>
                </div>

                <!-- Interactive Lovelys Bar Inside Letter -->
                <div id="lovelys-footer-bar" class="letter-lovelys-footer-bar">
                    <span class="bar-hint">
                        點擊下方 TWICE Lovely 獲得專屬祝福與愛心雨 🌸
                    </span>
                    <div id="inner-lovelys-list" class="inner-lovelys-flex">
                        <!-- Dynamic mini Lovely icons -->
                    </div>
                </div>
            </div>
        </article>

        <!-- Dark Glass Modal Backdrop -->
        <div id="modal-overlay" onclick="closeEnvelope()"></div>

        <!-- Toast Notification Popup -->
        <div id="toast-notification" class="toast-notification"></div>

        <!-- Image Zoom Lightbox Modal -->
        <div id="image-lightbox" class="image-lightbox" onclick="closeImageLightbox()">
            <button class="lightbox-close-btn" title="關閉照片" onclick="closeImageLightbox()">&times;</button>
            <img id="lightbox-img" src="" alt="Enlarged Photo" onclick="event.stopPropagation()">
            <div id="lightbox-caption" class="lightbox-caption" onclick="event.stopPropagation()"></div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="lovelys.js?v=4"></script>
    <script src="app.js?v=8"></script>
</body>

</html>
